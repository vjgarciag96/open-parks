[package]
name = "open-parks"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
webpki-roots = "1.0.9"

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.53.2", features = ["io-util"] }
tower = { version = "0.5.3", features = ["util"] }
